name: "Terraform CI/CD via AWS OIDC"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Core permission requirement for OIDC authentication
permissions:
  id-token: write # Required for requesting the JWT token from AWS
  contents: read  # Required to check out the repository code

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest

    env:
      AWS_REGION: "us-east-1"
      # Replace this with the output ARN generated in Step 1
      AWS_ROLE_ARN: "arn:aws:iam::298490729231:role/github-actions-terraform-role" 

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS dynamically using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: ://amazonaws.com

      # 3. Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0" # Match your specific version requirement

      # 4. Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # 5. Format validation check
      - name: Terraform Format Check
        run: terraform fmt -check

      # 6. Generate execution plan for all updates
      - name: Terraform Plan
        run: terraform plan -input=false

      # 7. Apply updates ONLY on a push directly to the main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
