name: "Terraform CI/CD via AWS OIDC"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Core permission requirement for OIDC authentication
permissions:
  id-token: write # Required for requesting the JWT token from AWS
  contents: read  # Required to check out the repository code

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-24.04

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. OPTIONAL: Debug OIDC Token Claims (Fixed multi-line format)
      - name: Debug OIDC Token Claims
        run: |
          JWT=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -s "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== DECODED CLAIMS ==="
          echo "$JWT" | cut -d'.' -f2 | base64 --decode | jq .

      # 3. Authenticate to AWS dynamically using OIDCs
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298490729231:role/github-actions-terraform-role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # 4. Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      # 5. Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # 6. Format validation check
      - name: Terraform Format Check
        run: terraform fmt -check

      # 7. Generate execution plan for all updates
      - name: Terraform Plan
        run: terraform plan -input=false

      # 8. Apply updates ONLY on a push directly to the main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
