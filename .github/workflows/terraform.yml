name: "Terraform CI/CD via AWS OIDC"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write 
  contents: read  

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-24.04

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS dynamically using OIDC (Moved to run clean first)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298490729231:role/github-actions-terraform-role
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true # Forces credentials to export cleanly as environment variables

      # 3. Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false # Prevents stdout wrapping from breaking backend S3 streams

      # 4. Initialize Terraform working directory
      - name: Terraform Init
        run: terraform init

      # 5. Format validation check
      - name: Terraform Format Check
        run: terraform fmt -check

      # 6. Generate execution plan for all updates
      - name: Terraform Plan
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -input=false

      # 7. Apply updates ONLY on a push directly to the main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve -input=false
