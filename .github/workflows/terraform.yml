name: "Terraform CI/CD via AWS OIDC"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-and-deploy:
    name: "Provision & Containerize"
    runs-on: ubuntu-latest

    env:
      AWS_REGION: "us-east-1"
      AWS_ROLE_ARN: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-role"
      ECR_REGISTRY: "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com"
      ECR_REPOSITORY: "securecart-app"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format 
        run: terraform fmt -recursive

      - name: Terraform Plan
        run: terraform plan -input=false
        env:
          TF_VAR_cloudfront_secret_token: ${{ secrets.CLOUDFRONT_SECRET_TOKEN }}
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_cloudfront_secret_token: ${{ secrets.CLOUDFRONT_SECRET_TOKEN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Immutable Docker Image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          # Publish the active immutable commit SHA to SSM Parameter Store
          aws ssm put-parameter \
            --name "/securecart/app/image_tag" \
            --value "$IMAGE_TAG" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

