<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCart Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #1a5cff; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 2rem; }
        .status-btn { background: #1a5cff; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .status-btn:hover { background: #0040e0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛒 SecureCart</h1>
        <p>Containerized Application Tier Successfully Deployed via GitHub OIDC Pipeline!</p>
        <button class="status-btn" onclick="alert('Backend connectivity healthy!')">Test Connection</button>
    </div>
</body>
</html>
